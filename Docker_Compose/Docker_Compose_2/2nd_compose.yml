version: "3.0"

services:
  web:
    image: nginx:latest
    container_name: container_nginx
    ports:
      - "8000:80"

  mysql:
    image: mysql:latest
    container_name: container_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dbdb
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
